# Sample label set + annotation set for the refined standard, revision 0.11 (refined_standard.md).
#
# - Uses the normative prefixed attribute names (Naming rules). The nested form of the same data is
#   in annotation-standard-sample-nested.yaml, generated from this file by stripping each
#   container's prefix.
# - Covers the changes in revisions 0.2-0.11: iFDO shape encodings (0.2), images named by UUID with
#   their pixel sizes (0.3), an image whose UUID is not embedded (0.4), per-model machine
#   provenance (0.5), review history (0.6), the 0.7 names, {name, uri} objects and containers,
#   a pixel mask as a compressed COCO RLE (0.8), each image's capture time (0.9),
#   and the standard version in each container (0.10),
#   and it validates against annotation-standard.schema.json (0.11).
# - An annotation set with no iFDO at all is shown in annotation-standard-sample-no-ifdo.yaml.
#
# Illustrative only: people, URLs, filenames, hashes and coordinates are invented. DOIs use the
# DataCite test prefix 10.5072. ORCID is ORCID's documented example ID. AphiaIDs should be checked
# in WoRMS.

label-set:
  label-set-standard-version: "0.11"
  label-set-name: PAP-SO abyssal epibenthic megafauna
  label-set-project:
    name: Porcupine Abyssal Plain Sustained Observatory (PAP-SO)
    uri: https://example.org/projects/pap-so
  label-set-context:
    name: RRS James Cook cruise JC999, AUV seabed photography
    uri: https://example.org/cruises/jc999
  label-set-abstract: >-
    Labels for invertebrate megafauna (>1 cm) visible in downward-facing AUV photographs of the
    PAP abyssal plain, defined for long-term monitoring of community composition. Morphotypes are
    used where identification to a named taxon is not possible from imagery.
  label-set-objective: >-
    Epibenthic echinoderm megafauna resolvable in images at 3 m altitude; excludes infauna, fishes
    and organisms smaller than 1 cm.
  label-set-creators:
    - name: Alex Example
      uri: https://orcid.org/0000-0002-1825-0097
    - name: Sam Placeholder
      uri: mailto:sam.placeholder@example.org
  label-set-pi:
    name: Alex Example
    uri: https://orcid.org/0000-0002-1825-0097
  label-set-license:
    name: CC-BY-4.0
    uri: https://creativecommons.org/licenses/by/4.0/
  label-set-copyright: (c) 2026 Example Oceanographic Centre
  label-set-uuid: d6c37bc4-4b96-4110-bfd8-6bc2cac3294e
  label-set-version: "2"
  label-set-related-material:
    - https://doi.org/10.5072/example.morphotype-guide
    - https://example.org/pap-so/megafauna-catalogue
  label-set-doi: 10.5072/example.labelset.pap-megafauna.v2
  label-set-catalogue: https://example.org/pap-so/megafauna-catalogue
  label-set-funding: Example Research Council grant EX/0001/1

