annotation-set:
  annotation-set-standard-version: "0.11"
  annotation-set-name: JC999 AUV megafauna annotations
  annotation-set-project:
    name: Porcupine Abyssal Plain Sustained Observatory (PAP-SO)
    uri: https://example.org/projects/pap-so
  annotation-set-context:
    name: RRS James Cook cruise JC999, AUV seabed photography
    uri: https://example.org/cruises/jc999
  annotation-set-abstract: >-
    Echinoderm megafauna annotations in a random subsample of images from two AUV missions.
    Megafauna were detected by a machine-learning model and by human annotators; machine
    detections were reviewed by a human.
  annotation-set-objective: >-
    Estimate density (individuals per m2) of echinoderm morphotypes at the PAP-SO site, to a
    precision suitable for detecting a 20% inter-annual change.
  annotation-set-target-environment: Abyssal plain soft-sediment seabed, 4800-4850 m, within the PAP-SO site boundary.
  annotation-set-target-timescale: Single survey, June 2026; part of an annual time series.
  annotation-set-curation-protocol: >-
    Every machine detection was reviewed by a human, who accepted, corrected or rejected it.
    A random 10% of human annotations were reviewed by a second annotator; uncertain cases were
    settled by the PI. Rejected annotations are kept in this set and are not occurrences.
  annotation-set-creators:
    - name: Sam Placeholder
      uri: mailto:sam.placeholder@example.org
    - name: Jo Sample
      uri: https://orcid.org/0000-0002-1825-0097
  annotation-set-pi:
    name: Alex Example
    uri: https://orcid.org/0000-0002-1825-0097
  annotation-set-license:
    name: CC-BY-4.0
    uri: https://creativecommons.org/licenses/by/4.0/
  annotation-set-copyright: (c) 2026 Example Oceanographic Centre
  annotation-set-uuid: 7f28f54d-17bd-4781-8b21-82345f6b11ed
  annotation-set-handle: https://hdl.example.org/annotations/7f28f54d-17bd-4781-8b21-82345f6b11ed
  annotation-set-version: "1.0"
  annotation-set-image-set-names:
    - JC999 AUV mission M42 seabed images
    - JC999 AUV mission M43 seabed images
  annotation-set-image-set-uuids:
