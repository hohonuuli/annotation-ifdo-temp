# Sample annotation set for images that have no iFDO (refined_standard.md, revision 0.11,
# "Images without an embedded UUID, or without an iFDO", Case 2).
#
# - annotation-set-image-metadata is "none", so the annotation-set-images entries are the only
#   records of the images. Image set UUIDs are omitted.
# - Image 1 had no UUID anywhere. Its UUID is a version 5 UUID derived from its SHA-256 with the
#   standard's provisional namespace 8fb66ecc-ce0d-45ff-b8ab-23bd7774d760, so anyone holding the
#   same file can recompute it.
# - Image 2 is only available from an IIIF image server, so it cannot be hashed. Its hash is null,
#   so image-handle and the pixel size are required.
# - The last annotation is a pixel mask stored as an uncompressed COCO RLE (revision 0.8).
# - It uses the label set in annotation-standard-sample.yaml.
#
# Illustrative only: people, URLs, hashes and coordinates are invented. ORCID is ORCID's
# documented example ID.

annotation-set:
  annotation-set-standard-version: "0.11"
  annotation-set-name: Legacy holothurian photographs, re-annotated
  annotation-set-abstract: >-
    Re-annotation of scanned photographs from a 2019 survey whose image metadata was never
    published. Positions and times are not available.
  annotation-set-objective: Presence of echinoderm morphotypes, for comparison with the PAP-SO time series.
  annotation-set-curation-protocol: All annotations reviewed by the PI.
  annotation-set-creators:
    - name: Sam Placeholder
      uri: mailto:sam.placeholder@example.org
  annotation-set-pi:
    name: Alex Example
    uri: https://orcid.org/0000-0002-1825-0097
  annotation-set-license:
    name: CC-BY-4.0
    uri: https://creativecommons.org/licenses/by/4.0/
  annotation-set-copyright: (c) 2026 Example Oceanographic Centre
  annotation-set-uuid: 8c3e1714-3bc8-4e3f-a8cb-44fe5c38971b
  annotation-set-version: "1.0"
  annotation-set-image-set-names:
    - Scanned 2019 survey photographs (no iFDO)
  annotation-set-image-metadata: none
  annotation-set-label-set-names:
    - PAP-SO abyssal epibenthic megafauna
  annotation-set-label-set-uuids:
    - d6c37bc4-4b96-4110-bfd8-6bc2cac3294e
  annotation-set-quantitative-or-qualitative: qualitative
  annotation-set-quantification-type: presence-absence

  annotation-set-images:
