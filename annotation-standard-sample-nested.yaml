# Nested form of annotation-standard-sample.yaml (refined_standard.md, revision 0.11, Naming rule 8).
#
# Generated from the prefixed sample: each key is the prefixed name with its container's prefix
# removed (label-set-, label-, annotation-set-, annotation-, image-, model-, review-).
# For example annotation-set > name == annotation-set-name, and annotation-set > annotations >
# image-uuid == annotation-image-uuid. The prefixed file is the normative form; both carry the
# same information.

label-set:
  standard-version: "0.11"
  name: PAP-SO abyssal epibenthic megafauna
  project:
    name: Porcupine Abyssal Plain Sustained Observatory (PAP-SO)
    uri: https://example.org/projects/pap-so
  context:
    name: RRS James Cook cruise JC999, AUV seabed photography
    uri: https://example.org/cruises/jc999
  abstract: >-
    Labels for invertebrate megafauna (>1 cm) visible in downward-facing AUV photographs of the
    PAP abyssal plain, defined for long-term monitoring of community composition. Morphotypes are
    used where identification to a named taxon is not possible from imagery.
  objective: >-
    Epibenthic echinoderm megafauna resolvable in images at 3 m altitude; excludes infauna, fishes
    and organisms smaller than 1 cm.
  creators:
    - name: Alex Example
      uri: https://orcid.org/0000-0002-1825-0097
    - name: Sam Placeholder
      uri: mailto:sam.placeholder@example.org
  pi:
    name: Alex Example
    uri: https://orcid.org/0000-0002-1825-0097
  license:
    name: CC-BY-4.0
    uri: https://creativecommons.org/licenses/by/4.0/
  copyright: (c) 2026 Example Oceanographic Centre
  uuid: d6c37bc4-4b96-4110-bfd8-6bc2cac3294e
  version: "2"
  related-material:
    - https://doi.org/10.5072/example.morphotype-guide
    - https://example.org/pap-so/megafauna-catalogue
  doi: 10.5072/example.labelset.pap-megafauna.v2
  catalogue: https://example.org/pap-so/megafauna-catalogue
  funding: Example Research Council grant EX/0001/1

  labels:
    - name: Echinodermata
      parent-name: null
      lowest-taxonomic-name: Echinodermata
      lowest-aphia-id: 1806
      is-lowest-taxon: true
      identification-qualifier: null
      uuid: e8ba7fd5-64cf-46e9-a305-4680895d9d7e
    - name: Holothurian morphotype 1
      parent-name: Echinodermata
      lowest-taxonomic-name: Holothuroidea
      lowest-aphia-id: 123083
      is-lowest-taxon: false
      identification-qualifier: indet.
      uuid: 4b4a9d33-21b2-4d8d-be2d-f74beb381069
    - name: Asteroid morphotype 2
      parent-name: Echinodermata
      lowest-taxonomic-name: Asteroidea
      lowest-aphia-id: 123080
      is-lowest-taxon: false
      identification-qualifier: indet.
      uuid: a4c667e9-051a-46e9-89e2-e66f3db47c05

annotation-set:
  standard-version: "0.11"
  name: JC999 AUV megafauna annotations
  project:
    name: Porcupine Abyssal Plain Sustained Observatory (PAP-SO)
    uri: https://example.org/projects/pap-so
  context:
    name: RRS James Cook cruise JC999, AUV seabed photography
    uri: https://example.org/cruises/jc999
  abstract: >-
    Echinoderm megafauna annotations in a random subsample of images from two AUV missions.
    Megafauna were detected by a machine-learning model and by human annotators; machine
    detections were reviewed by a human.
  objective: >-
    Estimate density (individuals per m2) of echinoderm morphotypes at the PAP-SO site, to a
    precision suitable for detecting a 20% inter-annual change.
  target-environment: Abyssal plain soft-sediment seabed, 4800-4850 m, within the PAP-SO site boundary.
  target-timescale: Single survey, June 2026; part of an annual time series.
  curation-protocol: >-
    Every machine detection was reviewed by a human, who accepted, corrected or rejected it.
    A random 10% of human annotations were reviewed by a second annotator; uncertain cases were
    settled by the PI. Rejected annotations are kept in this set and are not occurrences.
  creators:
    - name: Sam Placeholder
      uri: mailto:sam.placeholder@example.org
    - name: Jo Sample
      uri: https://orcid.org/0000-0002-1825-0097
  pi:
    name: Alex Example
    uri: https://orcid.org/0000-0002-1825-0097
  license:
    name: CC-BY-4.0
    uri: https://creativecommons.org/licenses/by/4.0/
  copyright: (c) 2026 Example Oceanographic Centre
  uuid: 7f28f54d-17bd-4781-8b21-82345f6b11ed
  handle: https://hdl.example.org/annotations/7f28f54d-17bd-4781-8b21-82345f6b11ed
  version: "1.0"
  image-set-names:
    - JC999 AUV mission M42 seabed images
    - JC999 AUV mission M43 seabed images
  image-set-uuids:
    - 4b30f1c8-d061-40e0-9d3a-8a971a3c1b45
    - 7f68599d-05a0-4a53-abca-c0aebf3a5143
  image-set-handles:
    - https://hdl.example.org/images/4b30f1c8-d061-40e0-9d3a-8a971a3c1b45
    - https://hdl.example.org/images/7f68599d-05a0-4a53-abca-c0aebf3a5143
  image-metadata: ifdo
  label-set-names:
    - PAP-SO abyssal epibenthic megafauna
  label-set-uuids:
    - d6c37bc4-4b96-4110-bfd8-6bc2cac3294e
  connected-set-uuids:
    - c578c04c-ab84-46a5-b098-4d2c53059f7e
  machine-scope: >-
    An object detector proposed megafauna boxes in all images. A second classifier relabelled
    detections of small echinoderms. Every machine annotation was reviewed by a human.
  related-material:
    - https://doi.org/10.5072/example.pap-methods-paper
  quantitative-or-qualitative: quantitative
  quantification-type: count
  biological-metrics: Density (individuals per m2) by morphotype.
  biological-stats: >-
    Image is the sampling unit; 2 missions x 250 images. Inter-annual comparison of density by
    generalised linear model.
  obis-datasets:
    - 10.5072/example.obis.jc999-megafauna
  funding: Example Research Council grant EX/0001/1

  models:
    - id: pap-det-v3
      name: YOLOv8m
      version: "3.1.0"
      task: detection+classification
      handle: https://doi.org/10.5072/example.pap-det-v3
      description: Inference at 1280 px, NMS IoU 0.5, 2x2 tiling with 10% overlap.
      score-type: YOLOv8 class confidence after NMS
      confidence-threshold: 0.25
      training-images: 6a09c969-28a1-4182-8154-69383e680222
      training-annotations: c53b9646-2dfd-4a66-bb7f-3df999874d54
      validation-images: ba13fe1b-f311-427f-894c-c50d155095a6
      validation-annotations: 15fcf0f7-c216-46d5-9ab3-e5429712c9df
    - id: pap-cls-v1
      name: ViT-B/16
      version: "1.0"
      task: classification
      handle: https://doi.org/10.5072/example.pap-cls-v1
      score-type: softmax class probability
      training-annotations: 6937cd3d-1e3e-445d-abd0-9ac53582888d
    - id: sam-vit-h
      name: Segment Anything (SAM) ViT-H
      version: sam_vit_h_4b8939
      task: segmentation
      handle: https://github.com/facebookresearch/segment-anything
      description: Prompted with one positive click by the annotator; mask scaled to full image resolution.
      score-type: SAM predicted IoU

